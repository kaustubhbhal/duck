[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duck"
version = "1.0.0"
description = "magic context for git"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Kaustubh Bhal", email = "kaustubh.bhal@gmail.com"}
]
dependencies = [
    "openai",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
license = {text = "Proprietary"}

[project.urls]
Homepage = "https://github.com/kaustubhbhal/duck"

[project.scripts]
duck = "duck.cli:main"
duck-prepare-commit-msg = "duck.prepare_commit_msg:main"
